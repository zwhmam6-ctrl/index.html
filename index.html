<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#8b93a3;--ac:#7c5cff;--bd:#272b35}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--tx:#15171c;--mu:#6b7280;--bd:#e3e5ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,"Segoe UI",Tahoma,sans-serif}
#app{max-width:640px;margin:auto;padding:0 12px 80px}
header{display:flex;gap:10px;align-items:center;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--mu);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}
.mu{color:var(--mu)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;object-fit:cover;flex:none}
img,video{max-width:100%;border-radius:10px;margin-top:8px;display:block}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px}
nav button{background:none;font-size:22px}
#stories{display:flex;gap:12px;overflow-x:auto;padding:6px 2px}
.st{flex:none;text-align:center;font-size:12px;cursor:pointer}
.st .av{width:56px;height:56px;outline:3px solid var(--ac);outline-offset:2px;margin:0 auto 4px}
.msg{max-width:75%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--card);border:1px solid var(--bd)}
.msg.me{background:var(--ac);color:#fff;margin-inline-start:auto}
#modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;padding:20px;text-align:center;color:#fff}
#toast{position:fixed;top:12px;inset-inline:12px;margin:auto;max-width:360px;background:var(--ac);color:#fff;padding:10px;border-radius:10px;text-align:center;display:none;z-index:10}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"></div>

<div id="auth" style="max-width:360px;margin:10vh auto;padding:16px">
  <h1>تواصل</h1>
  <input id="u" placeholder="اسم المستخدم (حروف إنجليزية وأرقام)"><br><br>
  <input id="n" placeholder="الاسم الظاهر (للتسجيل فقط)"><br><br>
  <input id="p" type="password" placeholder="كلمة السر (6 على الأقل)"><br><br>
  <div class="row"><button onclick="auth('login')">دخول</button><button class="g" onclick="auth('register')">حساب جديد</button></div>
  <div id="gbtn" style="margin-top:14px"></div>
  <p id="err" style="color:#f66"></p>
</div>

<div id="app" style="display:none">
  <header><b style="font-size:20px">تواصل</b><input id="q" placeholder="ابحث عن شخص" onkeydown="event.key=='Enter'&&search()"></header>
  <div id="main"></div>
  <nav>
    <button onclick="go('home')">🏠</button><button onclick="go('videos')">🎬</button>
    <button onclick="go('chats')">💬</button><button onclick="go('me')">👤</button>
  </nav>
</div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let T=localStorage.token,ME,ws,cur=null,SL=[],sq=[],si=0;

async function api(p,o={}){
  o.headers={Authorization:"Bearer "+T,...(o.headers||{})};
  if(o.json){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.json)}
  const r=await fetch("/api"+p,o);
  if(r.status==401){logout();throw Error("سجّل دخول")}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.detail||"خطأ");
  return d;
}
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3000)};
const av=u=>u.avatar?`<img class="av" src="${u.avatar}" style="margin:0">`:`<div class="av">${esc((u.name||u.username||"?")[0])}</div>`;
const media=m=>!m?"":/\.(mp4|webm|mov|m4v)$/i.test(m)?`<video src="${m}" controls playsinline></video>`:`<img src="${m}">`;

// ---- auth ----
async function auth(kind){
  try{
    const r=await fetch("/api/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#u").value,password:$("#p").value,name:$("#n").value})});
    const j=await r.json();if(!r.ok)throw Error(j.detail||"خطأ");
    T=j.token;localStorage.token=T;start();
  }catch(e){$("#err").textContent=e.message}
}
function logout(){localStorage.removeItem("token");T=null;ws&&ws.close();$("#app").style.display="none";$("#auth").style.display="block"}
async function start(){
  ME=await api("/me");$("#auth").style.display="none";$("#app").style.display="block";connect();go("home");
}
function connect(){
  ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws?token="+T);
  ws.onmessage=e=>{const m=JSON.parse(e.data);cur==m.from?addMsg(m.text,false):toast("رسالة جديدة من @"+m.from)};
  ws.onclose=()=>T&&setTimeout(connect,3000);
}
function go(v){cur=null;({home,videos,chats,me:()=>profile(ME.username)})[v]()}

// ---- posts ----
const postHTML=p=>`<div class="card"><div class="row" onclick="profile('${p.username}')" style="cursor:pointer">${av(p)}<b>${esc(p.name||p.username)}</b><span class="mu">@${p.username}</span></div><p>${esc(p.text)}</p>${media(p.media)}<button class="g" onclick="like(${p.id},this)">${p.liked?"❤️":"🤍"} ${p.likes}</button></div>`;
async function home(){
  $("#main").innerHTML=`<div id="stories"></div><div class="card"><textarea id="t" rows="2" placeholder="بم تفكر؟"></textarea><div class="row" style="margin-top:8px"><input type="file" id="f" accept="image/*,video/*"><button onclick="post()">نشر</button></div></div><div id="list"></div>`;
  stories();
  const l=await api("/feed");
  $("#list").innerHTML=l.map(postHTML).join("")||"<p class=mu>ما فيه منشورات. ابحث عن ناس وتابعهم 🔎</p>";
}
async function post(){
  const fd=new FormData();fd.append("text",$("#t").value);const f=$("#f").files[0];if(f)fd.append("f",f);
  try{await api("/posts",{method:"POST",body:fd});home()}catch(e){toast(e.message)}
}
async function like(id,b){
  await api("/like/"+id,{method:"POST"});
  const on=b.textContent.startsWith("🤍"),n=parseInt(b.textContent.slice(2))+(on?1:-1);
  b.textContent=(on?"❤️ ":"🤍 ")+n;
}
async function videos(){
  const l=await api("/videos");
  $("#main").innerHTML=l.map(postHTML).join("")||"<p class=mu>ما فيه فيديوهات. انشر فيديو من الرئيسية 🎬</p>";
}

// ---- stories ----
async function stories(){
  SL=await api("/stories");const g={};SL.forEach(s=>(g[s.username]=g[s.username]||[]).push(s));
  $("#stories").innerHTML=`<div class="st" onclick="document.getElementById('sf').click()"><div class="av">+</div>قصتي</div><input type="file" id="sf" hidden accept="image/*,video/*" onchange="addStory(this)">`+
    Object.keys(g).map(k=>`<div class="st" onclick="viewStory('${k}')"><div class="av">${esc((g[k][0].name||k)[0])}</div>${esc(k)}</div>`).join("");
}
async function addStory(i){
  const fd=new FormData();fd.append("f",i.files[0]);fd.append("text",prompt("نص القصة (اختياري)")||"");
  try{await api("/stories",{method:"POST",body:fd});stories()}catch(e){toast(e.message)}
}
function viewStory(k){sq=SL.filter(s=>s.username==k);si=0;showS()}
function showS(){
  const m=$("#modal");if(si>=sq.length){m.style.display="none";return}
  const s=sq[si];m.style.display="grid";
  m.innerHTML=`<div onclick="si++;showS()">${media(s.media)}<p>${esc(s.text)}</p><small>@${s.username} · اضغط للتالي</small></div>`;
}

// ---- chat ----
async function chats(){
  const l=await api("/chats");
  $("#main").innerHTML="<h3>المحادثات</h3>"+(l.map(u=>`<div class="card row" onclick="chat('${u.username}')" style="cursor:pointer">${av(u)}<b>${esc(u.name||u.username)}</b></div>`).join("")||"<p class=mu>ابحث عن شخص وافتح بروفايله لتبدأ محادثة.</p>");
}
const msgH=(t,me)=>`<div class="msg ${me?"me":""}">${esc(t)}</div>`;
async function chat(k){
  cur=k;const l=await api("/messages/"+k);
  $("#main").innerHTML=`<h3>@${k}</h3><div id="ms">${l.map(m=>msgH(m.text,m.mine)).join("")}</div><div class="row" style="position:sticky;bottom:60px"><input id="mi" placeholder="اكتب رسالة" onkeydown="event.key=='Enter'&&send()"><button onclick="send()">إرسال</button></div>`;
}
function addMsg(t,me){const m=$("#ms");m&&m.insertAdjacentHTML("beforeend",msgH(t,me))}
function send(){
  const i=$("#mi");if(!i.value.trim()||ws.readyState!=1)return;
  ws.send(JSON.stringify({to:cur,text:i.value}));addMsg(i.value,true);i.value="";
}

// ---- search / profile ----
async function search(){
  const t=$("#q").value.trim();if(!t)return;cur=null;
  const l=await api("/search?q="+encodeURIComponent(t));
  $("#main").innerHTML=l.map(u=>`<div class="card row" onclick="profile('${u.username}')" style="cursor:pointer">${av(u)}<b>${esc(u.name||u.username)}</b><span class="mu">@${u.username}</span></div>`).join("")||"<p>لا نتائج</p>";
}
async function profile(k){
  cur=null;const p=await api("/users/"+k),mine=p.id==ME.id;
  $("#main").innerHTML=`<div class="card"><div class="row">${av(p)}<div><b>${esc(p.name||p.username)}</b> ${p.private?"🔒":""}<div class="mu">@${p.username}</div></div></div><p>${esc(p.bio)}</p><div class="mu">${p.followers} متابِع · ${p.following_count} يتابع</div><div class="row" style="margin-top:8px">`+
    (mine?`<button onclick="editP()">تعديل</button><button class="g" onclick="logout()">خروج</button>`:`<button onclick="fol('${k}')">${p.following?"إلغاء المتابعة":"متابعة"}</button><button class="g" onclick="chat('${k}')">💬 مراسلة</button>`)+
    `</div></div>`+(p.can_view?p.posts.map(postHTML).join(""):"<p class=mu>🔒 حساب خاص. تابعه لتشوف منشوراته.</p>");
}
async function fol(k){await api("/follow/"+k,{method:"POST"});profile(k)}
function editP(){
  $("#main").innerHTML=`<div class="card"><input id="en" value="${esc(ME.name)}" placeholder="الاسم"><br><br><textarea id="eb" rows="3" placeholder="نبذة">${esc(ME.bio)}</textarea><label class="row"><input type="checkbox" id="ep" style="width:auto" ${ME.private?"checked":""}> حساب خاص</label><p>الصورة: <input type="file" id="ea" accept="image/*"></p><button onclick="saveP()">حفظ</button></div>`;
}
async function saveP(){
  const a=$("#ea").files[0];
  if(a){const fd=new FormData();fd.append("f",a);await api("/avatar",{method:"POST",body:fd})}
  await api("/me",{method:"PUT",json:{name:$("#en").value,bio:$("#eb").value,private:$("#ep").checked}});
  ME=await api("/me");profile(ME.username);
}

async function initGoogle(){
  const c=await (await fetch("/api/config")).json();
  if(!c.google_client_id)return;
  const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";
  s.onload=()=>{
    google.accounts.id.initialize({client_id:c.google_client_id,callback:async r=>{
      try{
        const x=await fetch("/api/google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:r.credential})});
        const j=await x.json();if(!x.ok)throw Error(j.detail||"خطأ");
        T=j.token;localStorage.token=T;start();
      }catch(e){$("#err").textContent=e.message}
    }});
    google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",text:"continue_with",width:300});
  };
  document.head.appendChild(s);
}
initGoogle();
if(T)start().catch(()=>{});
</script>
</body>
</html>
